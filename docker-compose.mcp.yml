services:
  devbox-mcp:
    image: devbox-mcp-gateway:latest
    build:
      context: ./build/devbox-mcp
    #ports:
    #  - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DEVBOX_MCP_PROTECTED_SERVICES: ${DEVBOX_MCP_PROTECTED_SERVICES:-}
      DEVBOX_MCP_DEFAULT_TIMEOUT: ${DEVBOX_MCP_DEFAULT_TIMEOUT:-180}
      DEVBOX_MCP_MAX_TIMEOUT: ${DEVBOX_MCP_MAX_TIMEOUT:-3600}
      DEVBOX_MCP_MAX_OUTPUT_KB: ${DEVBOX_MCP_MAX_OUTPUT_KB:-64}
      DEVBOX_MCP_MAX_PROCS: ${DEVBOX_MCP_MAX_PROCS:-5}
      DEVBOX_MCP_MAX_LOG_MB: ${DEVBOX_MCP_MAX_LOG_MB:-10}
